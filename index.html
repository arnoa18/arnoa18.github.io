<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ARNOA 앱</title>
<style>
  :root { --bg:#F4FAFF; --card:#FFFFFF; --ink:#0B2540; --sub:#5B7A99; --pri:#1E90FF; --line:#CFE3F7; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#08121F; --card:#10223A; --ink:#EAF4FF; --sub:#8FB0D0; --pri:#3DA5FF; --line:#1E3A5C; }
  }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif; line-height:1.7; }
  header { background:#1E6FD6; color:#fff; padding:28px 20px; }
  header h1 { margin:0; font-size:1.5rem; }
  main { max-width:720px; margin:0 auto; padding:24px 16px 48px; }
  .app { display:flex; align-items:center; gap:14px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:12px; color:inherit; text-decoration:none; }
  .app:hover { border-color:var(--pri); }
  .app img { width:64px; height:64px; border-radius:14px; flex:none; }
  .app .t { flex:1; }
  .app h2 { margin:0; font-size:1.1rem; }
  .app p { margin:2px 0 0; color:var(--sub); font-size:.92rem; }
  .app .go { color:var(--sub); font-size:1.6rem; }
  footer { max-width:720px; margin:0 auto; padding:0 16px 32px; color:var(--sub); font-size:.9rem; }
  a.mail { color:var(--pri); }
</style>
</head>
<body>
<header>
  <h1>ARNOA 앱</h1>
</header>
<main>
  <a class="app" href="/paynote/">
    <img src="/paynote/icon.png" alt="급여노트 아이콘">
    <div class="t">
      <h2>급여노트</h2>
      <p>연봉 실수령액, 퇴직금, 생활 계산, 내 급여 기록</p>
    </div>
    <span class="go" aria-hidden="true">&rsaquo;</span>
  </a>
</main>
<footer>&copy; ARNOA &middot; 문의: <a class="mail" href="mailto:ggongary18@naver.com">ggongary18@naver.com</a></footer>
</body>
</html>
